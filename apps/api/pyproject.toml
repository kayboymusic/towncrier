[project]
name = "town-crier-api"
version = "0.1.0"
description = "Town Crier read API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.4",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "supabase>=2.9.1",
  "python-dotenv>=1.0.1",
  "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3.3",
  "httpx>=0.27.2",
  "ruff>=0.7.2",
]
