[project]
name = "town-crier-workers"
version = "0.1.0"
description = "Town Crier ingestion + AI processing workers"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27.2",
  "anthropic>=0.39.0",
  "openai>=1.54.0",
  "supabase>=2.9.1",
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "python-dotenv>=1.0.1",
  "tenacity>=9.0.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "typer>=0.13.0",
  "rich>=13.9.4",
  "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workers"]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3.3",
  "ruff>=0.7.2",
]
